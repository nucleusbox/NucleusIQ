[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nucleusiq-mcp"
version = "0.1.1"
description = "Model Context Protocol (MCP) tool adapter for the NucleusIQ AI agent framework. Connect any MCP server (stdio, Streamable HTTP, SSE) as a NucleusIQ BaseTool."
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "Nucleusbox", email = "info@nucleusbox.com" }]
keywords = ["AI", "agents", "mcp", "model-context-protocol", "tools", "nucleusiq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework. We require 0.7.12 for the cross-cutting native-tool
    # observability scaffolding (ToolCallRecord.executed_by, LLMCallRecord
    # enrichment) shipped alongside the v0.7.12 release line, on top of the
    # ExpandableTool protocol / ToolCallRecord.source plumbing that landed
    # in 0.7.11.
    "nucleusiq>=0.7.12",
    # Official MCP Python SDK.  Stable transports + OAuth provider surface;
    # <2 to allow patch upgrades but require an explicit bump on a 2.x major.
    #
    # The 1.28.1 floor is a security floor, not a feature one.  1.27.x shipped
    # three advisories against the server transports we hand to the SDK: HTTP
    # transports served session requests without verifying the authenticated
    # principal, experimental task handlers let any client read and cancel
    # another client's tasks (both fixed in 1.27.2), and the WebSocket
    # transport had no Host/Origin validation (fixed in 1.28.1).  A `>=1.27`
    # floor still *permits* resolving to a vulnerable release, which is what a
    # constrained environment or a stale lockfile will actually do.
    "mcp>=1.28.1,<2",
    # httpx is used implicitly through the SDK's HTTP transports and
    # auth Auth instances we hand to it.  We don't import it directly,
    # but we depend on it so users get a known-good version when the
    # SDK doesn't pin a strict floor.  Drop this once the SDK pins it
    # tightly enough.
    "httpx>=0.27,<1",
    # NOTE: ``anyio`` is intentionally NOT listed here.  The MCP SDK
    # depends on it transitively (it powers all three SDK transports),
    # but ``nucleusiq-mcp`` itself uses plain ``asyncio`` everywhere —
    # ``AsyncExitStack``, ``Lock``, ``gather``, ``wait_for``.  Adding
    # anyio as a direct dep would imply we use its trio bridge, which
    # we do not.  If a future feature (e.g. structured concurrency for
    # parallel tool calls) needs anyio, add it back then.
]

[project.optional-dependencies]
oauth = ["mcp[cli]>=1.28.1,<2"]

[project.urls]
Homepage = "https://github.com/nucleusbox/NucleusIQ"
Repository = "https://github.com/nucleusbox/NucleusIQ"
Issues = "https://github.com/nucleusbox/NucleusIQ/issues"

[dependency-groups]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=4.0,<8.0",
    "pytest-mock>=3.10,<4.0",
]
lint = ["ruff>=0.15.14,<1.0", "pyrefly>=1.0,<2"]
dev = [{ include-group = "test" }, { include-group = "lint" }]
examples = ["python-dotenv>=1.0,<2"]
full = [{ include-group = "dev" }, { include-group = "examples" }]

[tool.uv.sources]
nucleusiq = { path = "../../../nucleusiq", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["nucleusiq_mcp"]

[tool.hatch.build.targets.sdist]
# The wheel is scoped by `packages`, but an sdist defaults to everything not
# gitignored — so tests/ and examples/ ship to PyPI unless excluded here.
exclude = [
    "tests",
    "examples",
    "dist",
    "build",
    ".venv",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.ruff_cache",
]

[tool.pyrefly]
python-version = "3.10"
project-includes = ["nucleusiq_mcp/"]
project-excludes = ["tests/", "examples/", "build/"]
ignore-missing-imports = ["nucleusiq.*", "mcp.*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -vv"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring a live MCP server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["nucleusiq_mcp"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
