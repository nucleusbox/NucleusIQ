[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nucleusiq-openai"
version = "0.7.1"
description = "OpenAI provider for the NucleusIQ AI agent framework – ChatGPT, GPT-4, embeddings, structured output, and tool integration."
requires-python = ">=3.10,<4.0"
license = "MIT"
authors = [
    { name = "Nucleusbox", email = "info@nucleusbox.com" }
]
keywords = ["AI", "agents", "openai", "gpt", "nucleusiq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "nucleusiq>=0.7.12",
    # Upper bound is deliberate. openai 3.x is a major SDK revision that has
    # not been exercised against this adapter's Responses API paths, and every
    # test here is mocked, so a green suite would prove nothing about it.
    # Raising this belongs in its own change, verified against the live API.
    "openai>=1.0,<4.0",
    "tiktoken>=0.5",
    # Declared because `_shared/retry.py` imports httpx at module scope to
    # classify transport errors. It used to arrive transitively via the openai
    # SDK, which stopped shipping it in 3.x — so a fresh install raised
    # ModuleNotFoundError before the adapter could import. Depend on what you
    # import; transitive availability is not a contract.
    "httpx>=0.27,<1",
    # Same rule: the params and response models are pydantic models. It also
    # arrives via nucleusiq, but that is core's dependency to change, not ours.
    "pydantic>=2.11.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/nucleusbox/NucleusIQ"
Repository = "https://github.com/nucleusbox/NucleusIQ"
Issues = "https://github.com/nucleusbox/NucleusIQ/issues"

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735)
# ---------------------------------------------------------------------------
[dependency-groups]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=4.0,<8.0",
    "pytest-mock>=3.10,<4.0",
]
lint = [
    "ruff>=0.4,<1.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# ---------------------------------------------------------------------------
# uv – local editable sources for monorepo development
# ---------------------------------------------------------------------------
[tool.uv.sources]
nucleusiq = { path = "../../../nucleusiq", editable = true }

[tool.uv]
constraint-dependencies = [
    "pygments>=2.20.0",
]

# ---------------------------------------------------------------------------
# Hatch build config
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["nucleusiq_openai"]

[tool.hatch.build.targets.sdist]
# The wheel is scoped by `packages`, but an sdist defaults to everything not
# gitignored — so tests/ and examples/ ship to PyPI unless excluded here.
exclude = [
    "tests",
    "examples",
    "dist",
    "build",
    ".venv",
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/.ruff_cache",
]

# ---------------------------------------------------------------------------
# Pyrefly — static type checking
# ---------------------------------------------------------------------------
[tool.pyrefly]
python-version = "3.10"
project-includes = ["nucleusiq_openai/"]
project-excludes = ["tests/", "examples/", "build/"]
ignore-missing-imports = ["nucleusiq.*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101",
]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -vv"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests requiring live API keys",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
omit = ["tests/*", "examples/*"]
